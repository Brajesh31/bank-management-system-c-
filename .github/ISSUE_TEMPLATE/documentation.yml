name: "📝 Documentation improvement"
description: Report missing, unclear, or inaccurate documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: path
    attributes:
      label: Document path
      placeholder: docs/usage.md
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is unclear or inaccurate?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction
